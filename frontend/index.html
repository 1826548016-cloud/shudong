<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My world</title>
    <meta name="description" content="My world" />

    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{
        font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;
        font-size:14px;line-height:1.6;color:#1f2329;
        background:#f7f8fa;
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
        color-scheme:light;
      }
      body{min-height:100vh;background:#f7f8fa;overflow-x:hidden}
      #app{min-height:100vh;contain:layout style}
      .topbar{
        position:fixed;top:0;left:0;right:0;z-index:100;
        height:56px;background:rgba(255,255,255,.78);
        backdrop-filter:saturate(180%) blur(20px);
        -webkit-backdrop-filter:saturate(180%) blur(20px);
        border-bottom:1px solid #e5e6eb;
      }
      .main{padding-top:56px;min-height:100vh;contain:layout}
      .site-footer{
        position:fixed;bottom:0;left:0;right:0;z-index:99999;
        height:42px;display:flex;align-items:center;justify-content:center;
        background:#1f2329;
      }
    </style>

    <script>
      (function () {
        try {
          var s = localStorage.getItem('treehole_theme')
          if (s === 'dark') document.documentElement.classList.add('dark')
          else document.documentElement.classList.add('light')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
